  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("flunx-theme");
          var root = document.documentElement;
          root.classList.remove("theme-light", "theme-mixed", "dark");
          if (t === "light") root.classList.add("theme-light");
          else if (t === "dark") root.classList.add("dark");
          else root.classList.add("theme-mixed");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
